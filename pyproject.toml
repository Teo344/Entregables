[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avocadoia-datos"
version = "0.2.0"
description = "Pipeline reproducible del conjunto de datos de AvocadoIA (OE2): ETL y EDA"
requires-python = ">=3.11"
dependencies = [
    "Pillow==12.3.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
# Análisis con redes preentrenadas (spec 002, research E1); requiere Python 3.12 (.venv-ml).
eda = [
    "tensorflow==2.20.0",
    "keras==3.15.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "python-docx==1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ml: requiere TensorFlow (entorno .venv-ml)"]
