[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avocadoia-datos"
version = "0.1.0"
description = "Pipeline reproducible del conjunto de datos de AvocadoIA (OE2)"
requires-python = ">=3.11"
dependencies = [
    "Pillow==12.3.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
