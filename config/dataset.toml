# Configuración del pipeline del conjunto de datos (spec 001-pipeline-dataset).
# Cambiar cuotas o proporciones cambia la muestra: justificarlo y regenerar con `todo`.

semilla = 42
max_por_clase = 1000

[proporciones]
train = 0.70
val = 0.15
test = 0.15

# Cuotas por fuente dentro de cada clase (claves = columna `fuente` de fuentes.csv).
# Revisión 2026-10-26: avocare_ excluida (copias aumentadas; ver datos/curacion/exclusiones_revision.csv).
[cuotas.sano]
mdpi_pedunculo_sano = 360
hass = 396          # una foto por fruto: los 396 frutos de la serie
rgb_sano = 83
sano_web = 161

[cuotas.antracnosis]
rgb_antracnosis = 664      # todas
kaggle_antracnosis = 336   # 734 fotos con lesión visible de ~150 frutos (5-7 vistas por fruto)

[cuotas.pedunculo]
mdpi_pedunculo = 284

[preprocesamiento]
tamano = 224
calidad_jpeg = 95
umbral_brillo = 40
umbral_borrosidad = 50
lado_minimo = 224
aspecto_maximo = 2.0

# Solo entrenamiento; se documenta en el informe, no se aplica aquí (research D10).
[aumento]
rotacion_grados = 45
desplazamiento = 0.20
zoom = 0.20
volteo_horizontal = true
volteo_vertical = true
brillo = [0.8, 1.2]

[planilla]
lote = 250
